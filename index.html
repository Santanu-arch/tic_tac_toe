<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      color: #333;
      margin-bottom: 40px;
      font-size: 4em;
    }

    #game {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-template-rows: repeat(3, 120px);
      gap: 10px;
      padding: 10px;
      background-color: #000;
      border-radius: 10px;
    }

    .cell {
      width: 120px;
      height: 120px;
      font-size: 3em;
      font-weight: bold;
      background-color: #fff;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.3s ease;
      border-radius: 8px;
    }

    .cell:hover {
      background-color: #e6e6e6;
    }

    #status {
      margin-top: 50px;
      font-size: 3em;
      color: #555;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 2.5em;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    span.red { color: red; }
    span.blue { color: blue; }
    span.black { color: black; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="game">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>
  <p id="status"><span class="red">X</span>'s turn</p>
  <button onclick="resetGame()">Reset</button>

  <script>
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('status');
    let currentPlayer = 'X';
    let board = ['', '', '', '', '', '', '', '', ''];
    let isGameActive = true;

    const winningCombos = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function handleCellClick(e) {
      const index = e.target.getAttribute('data-index');
      if (board[index] !== '' || !isGameActive) return;

      board[index] = currentPlayer;
      e.target.innerHTML = currentPlayer === 'X' 
        ? '<span class="red">X</span>' 
        : '<span class="blue">O</span>';

      if (checkWin()) {
        statusText.innerHTML = `<span class="${currentPlayer === 'X' ? 'red' : 'blue'}">${currentPlayer}</span> wins!`;
        isGameActive = false;
      } else if (board.every(cell => cell !== '')) {
        statusText.innerHTML = `<span class="black">It's a draw!</span>`;
        isGameActive = false;
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusText.innerHTML = `<span class="${currentPlayer === 'X' ? 'red' : 'blue'}">${currentPlayer}</span>'s turn`;
      }
    }

    function checkWin() {
      return winningCombos.some(combo => {
        return combo.every(i => board[i] === currentPlayer);
      });
    }

    function resetGame() {
      board = ['', '', '', '', '', '', '', '', ''];
      cells.forEach(cell => cell.textContent = '');
      currentPlayer = 'X';
      isGameActive = true;
      statusText.innerHTML = `<span class="red">X</span>'s turn`;
    }

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
  </script>
</body>
</html>
